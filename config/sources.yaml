# Official sources (always allowed; not subject to the news allowlist)
official:
  - id: vote_travis
    name: Travis County Elections (VoteTravis)
    domain: votetravis.gov
  - id: texas_legislature_online
    name: Texas Legislature Online
    domain: capitol.texas.gov
  - id: congress_gov
    name: Congress.gov
    domain: congress.gov
  - id: fec_gov
    name: Federal Election Commission
    domain: fec.gov
  - id: tec_texas
    name: Texas Ethics Commission
    domain: ethics.state.tx.us
  - id: austin_city_clerk
    name: Austin City Clerk
    domain: austintexas.gov
  - id: tames
    name: Texas Appellate Management & E-Filing System
    domain: search.txcourts.gov
  - id: oca_texas
    name: Texas Office of Court Administration
    domain: txcourts.gov
  - id: austin_bar
    name: Austin Bar Association
    domain: austinbar.org
  - id: fcc_public_file
    name: FCC Public Inspection File
    domain: publicfiles.fcc.gov
  - id: meta_ad_library
    name: Meta Ad Library
    domain: facebook.com/ads/library
  - id: google_political_ads
    name: Google Political Ads Transparency
    domain: transparencyreport.google.com
  - id: irs_8872
    name: IRS Form 8872 (527 donors)
    domain: apps.irs.gov
  - id: wayback_machine
    name: Wayback Machine (archived campaign sites)
    domain: web.archive.org

# Social platforms (PLAN.md §5 "Social media"). Source.outlet = platform id.
# Only candidates' own, campaign-linked accounts are scraped.
social:
  - id: bluesky
    method: api
  - id: x
    method: api_or_snippet # X_BEARER_TOKEN → API, else SerpApi snippets
  - id: facebook
    method: snippet
  - id: instagram
    method: snippet
  - id: tiktok
    method: snippet
  - id: threads
    method: snippet
  - id: youtube
    method: snippet

# IFCN fact-check signatories (PLAN.md §5 "Fact-checks")
# Only these outlets can produce FactCheck entries. No aggregate truthfulness score.
fact_checkers:
  - id: politifact
    name: PolitiFact
    domain: politifact.com
    ifcn_signatory: true
  - id: factcheck_org
    name: FactCheck.org
    domain: factcheck.org
    ifcn_signatory: true
  - id: washington_post_fact_checker
    name: Washington Post Fact Checker
    domain: washingtonpost.com
    ifcn_signatory: true
  - id: ap_fact_check
    name: AP Fact Check
    domain: apnews.com
    ifcn_signatory: true
