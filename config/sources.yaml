# config/sources.yaml — outlet allowlist for Context Brief discovery (PLAN.md §5 "Context")
# Only outlets on this list may appear in ContextBrief.confirmed / supporters / opponents.
# Two articles that copy the same wire story count once.
# Published in the app ("How it works" page).
# Version this file in Release.configVersions["sources"].

version: "sources-v1"

# Questionnaire / ballot-guide sources (highest priority per PLAN.md §5 "Voice")
questionnaires:
  - id: vote411
    name: VOTE411 (League of Women Voters)
    url: https://www.vote411.org
    type: questionnaire
  # Hosts only matter for matching: a configured domain also covers its subdomains and `www.`
  # (so vote411.org covers onyourballot.vote411.org). The 2026 general-election guides live
  # under texastribune.org/2026/...; the old apps.texastribune.org primary-guide URL is a 404.
  - id: texas_tribune_voter_guide
    name: Texas Tribune Voter Guide
    url: https://www.texastribune.org
    type: questionnaire
  - id: kut_statesman_voter_guide
    name: KUT / Austin American-Statesman Voter Guide
    url: https://www.kut.org
    type: questionnaire
  - id: ballotpedia
    name: Ballotpedia
    url: https://ballotpedia.org
    type: questionnaire
  - id: lwv_austin
    name: League of Women Voters of the Austin Area
    url: https://www.lwvaustin.org
    type: questionnaire
  - id: lwv_texas
    name: League of Women Voters of Texas
    url: https://www.lwvtexas.org
    type: questionnaire
  - id: statesman_voter_guide
    name: Austin American-Statesman Voter Guide
    url: https://www.statesman.com
    type: questionnaire
  - id: community_impact_voter_guide
    name: Community Impact Voter Guide
    url: https://communityimpact.com
    type: questionnaire
  - id: austin_chronicle_voter_guide
    name: Austin Chronicle Candidate Q&A
    url: https://www.austinchronicle.com
    type: questionnaire
  - id: acc_candidates
    name: Austin Community College election pages
    url: https://www.austincc.edu
    type: questionnaire

